<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturo - Connexion & Inscription</title>
    <link rel="stylesheet" href="index.css">
    <script src="indexcopie2.js" defer></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYIKtqrK-fUumzBotjwMJqxtpzZeLhUQw",
            authDomain: "queen-t.firebaseapp.com",
            projectId: "queen-t",
            storageBucket: "queen-t.firebasestorage.app",
            messagingSenderId: "419154805005",
            appId: "1:419154805005:web:67a8f499188ca891393044"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.db = db;
        window.auth = auth;
        window.dbModules = { collection, getDocs, addDoc, updateDoc, deleteDoc, doc, getDoc, setDoc };
        window.authModules = { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut };
    </script>
    <style>
        /* Petit style propre et rapide pour positionner l'œil sans toucher à ton CSS global */
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-container input {
            width: 100%;
            padding-right: 40px !important; /* Laisse de la place pour l'icône */
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            color: #666;
        }
    </style>
</head>

<body class="auth-body">

    <main class="auth-container">
        <div class="auth-card">
            <!-- En-tête de bienvenue -->
            <div class="auth-header">
                <h1>📑 Total Clean Pro</h1>
                <p>Simplifiez la gestion et la facturation de votre activité</p>
            </div>

            <!-- Onglets de basculement Connexion / Inscription -->
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Se connecter</button>
                <button class="tab-btn" onclick="switchTab('register')">Créer un compte</button>
            </div>

            <!-- Formulaire de Connexion -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="votre@email.com" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <div class="password-container">
                        <input type="password" id="login-password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('login-password', this)">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-primary btn-block">Se connecter</button>
            </form>

            <!-- Formulaire d'Inscription (Caché par défaut) -->
            <form id="register-form" class="auth-form hidden">
                <div class="form-group">
                    <label>Nom de l'entreprise</label>
                    <input type="text" id="reg-company" placeholder="Ex: Total Clean Pro" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" placeholder="votre@email.com" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <div class="password-container">
                        <input type="password" id="reg-password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('reg-password', this)">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-primary btn-block">Créer mon compte</button>
            </form>
        </div>
    </main>

    <script>
        // Script pour basculer entre Connexion et Inscription
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const buttons = document.querySelectorAll('.tab-btn');

            buttons.forEach(btn => btn.classList.remove('active'));

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                event.target.classList.add('active');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                event.target.classList.add('active');
            }
        }

        // Fonction magique pour afficher/masquer le mot de passe au clic sur l'œil
        function togglePassword(fieldId, btnElement) {
            const inputField = document.getElementById(fieldId);
            if (inputField.type === 'password') {
                inputField.type = 'text';
                btnElement.textContent = '🙈'; // Change l'œil en mode masqué
            } else {
                inputField.type = 'password';
                btnElement.textContent = '👁️'; // Remet l'œil normal
            }
        }
    </script>
</body>

</html>
